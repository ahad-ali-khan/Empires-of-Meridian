services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_local
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: ["meridian_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:8.2.1-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: ["meridian_redis:/data"]
volumes:
  meridian_postgres:
  meridian_redis:
